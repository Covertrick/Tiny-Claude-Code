<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>Tiny QQ Agent · Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { max-width: 100vw; overflow-x: hidden; }
    body {
      background: #0f1419; color: #e7ecf1;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .card { background: #1a222c; border: 1px solid #2a3542; border-radius: 14px; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #243040; }
    .tap { min-height: 40px; touch-action: manipulation; }
    .modal-bg { background: rgba(0,0,0,.65); }
    .board-scroll {
      display: flex; gap: .75rem; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory;
    }
    .board-col {
      flex: 0 0 min(78vw, 260px); scroll-snap-align: start;
      min-height: 160px; max-height: 50vh; overflow-y: auto;
    }
    @media (min-width: 768px) {
      .board-scroll { display: grid; grid-template-columns: repeat(3,1fr); overflow: visible; }
      .board-col { flex: none; max-height: 380px; }
    }
    .graph-box { height: 200px; }
    @media (min-width: 768px) { .graph-box { height: 260px; } }
    textarea, input, button { font-size: 16px; }
    @media (min-width: 640px) { textarea, input, button { font-size: inherit; } }
    pre.preview {
      white-space: pre-wrap; word-break: break-word;
      max-height: 50vh; overflow: auto;
      background: #0c1016; border-radius: 10px; padding: 12px;
      font-size: 13px; line-height: 1.5;
    }
  </style>
</head>
<body class="min-h-screen">
<div id="app" class="w-full max-w-6xl mx-auto px-3 sm:px-4 py-4 space-y-4">
  <header class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 sticky top-0 z-20 py-2 bg-[#0f1419]/95 backdrop-blur">
    <div class="min-w-0">
      <p class="text-[10px] tracking-widest text-teal-400/80 uppercase">Tiny QQ Agent</p>
      <h1 class="text-xl sm:text-2xl font-semibold">控制台</h1>
      <p class="text-xs text-slate-400 mt-1 truncate" v-if="me">QQ {{ me.qq }} · 数据已同步数据库</p>
    </div>
    <button @click="reloadAll" class="tap px-4 py-2 rounded-xl bg-teal-600/90 text-sm w-full sm:w-auto">刷新</button>
  </header>

  <div v-if="err" class="card p-4 text-rose-300 text-sm">{{ err }}
    <p class="text-slate-400 mt-2">请私聊机器人「打开控制台」重新进入。</p>
  </div>

  <template v-if="me">
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="card p-3"><p class="text-xs text-slate-400">记忆</p><p class="text-2xl">{{ metrics?.memory?.total ?? '—' }}</p></div>
      <div class="card p-3"><p class="text-xs text-slate-400">Vault</p><p class="text-2xl">{{ me.vault?.stats?.files ?? 0 }}</p></div>
      <div class="card p-3"><p class="text-xs text-slate-400">嵌入</p><p class="text-2xl">{{ metrics?.embedding || '—' }}</p></div>
    </section>

    <nav class="flex gap-2 overflow-x-auto pb-1">
      <button v-for="t in tabs" :key="t.id" @click="tab=t.id"
              class="tap shrink-0 px-4 py-2 rounded-xl text-sm border"
              :class="tab===t.id ? 'bg-teal-700/80 border-teal-500' : 'bg-black/20 border-slate-700'">
        {{ t.label }}
      </button>
    </nav>

    <!-- 待办 -->
    <section v-show="tab==='sched'" class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <button @click="openCreate('sched')" class="tap px-4 py-2 rounded-xl bg-teal-700/80 text-sm">＋ 新建待办</button>
      </div>
      <div class="card p-3">
        <p class="text-[11px] text-slate-500 mb-2 md:hidden">左右滑动列</p>
        <div class="board-scroll text-sm">
          <div v-for="col in boardCols" :key="col.key" class="board-col rounded-xl bg-black/20 p-2">
            <p class="text-xs text-slate-400 mb-2">{{ col.label }}</p>
            <div v-for="s in byStatus(col.key)" :key="s.id" class="mb-2 p-3 rounded-xl bg-[#222b36] border border-[#314050]">
              <p class="leading-snug break-words">{{ s.title }}</p>
              <p class="text-[11px] text-slate-500 mt-1">{{ s.category }} · {{ (s.due_at||'').slice(0,16) }}</p>
              <div class="flex flex-wrap gap-1.5 mt-2">
                <button @click="previewSched(s)" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700">预览</button>
                <button @click="editSched(s)" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700">编辑</button>
                <a :href="'/api/schedules/'+s.id+'/download'" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700 inline-flex items-center">下载</a>
                <button v-if="s.status!=='done'" @click="setStatus(s,'done')" class="tap text-xs px-2 py-1 rounded-lg bg-teal-700/80">完成</button>
                <button @click="delSched(s)" class="tap text-xs px-2 py-1 rounded-lg bg-rose-800/80">删除</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 记忆 -->
    <section v-show="tab==='mem'" class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <input v-model="memQ" @keyup.enter="loadKnowledge" placeholder="搜索记忆…"
               class="flex-1 bg-black/30 border border-slate-600 rounded-xl px-3 py-2" />
        <button @click="loadKnowledge" class="tap px-4 py-2 rounded-xl bg-slate-700 text-sm">搜</button>
        <button @click="openCreate('mem')" class="tap px-4 py-2 rounded-xl bg-teal-700/80 text-sm">＋ 新建</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div v-for="k in knowledge" :key="k.id" class="card p-3">
          <p class="text-sm break-words">{{ k.title || '(无标题)' }} <span class="chip">{{ k.kind }}</span></p>
          <p class="text-xs text-slate-400 mt-1 line-clamp-3">{{ k.text }}</p>
          <div class="flex flex-wrap gap-1.5 mt-3">
            <button @click="previewMem(k)" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700">预览</button>
            <button @click="editMem(k)" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700">编辑</button>
            <a :href="'/api/knowledge/'+k.id+'/download'" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700 inline-flex items-center">下载</a>
            <button @click="delMem(k)" class="tap text-xs px-2 py-1 rounded-lg bg-rose-800/80">删除</button>
          </div>
        </div>
        <p v-if="!knowledge.length" class="text-xs text-slate-600 col-span-full text-center py-6">暂无记忆</p>
      </div>
    </section>

    <!-- Vault -->
    <section v-show="tab==='vault'" class="space-y-3">
      <div v-if="!vault.enabled" class="card p-4 text-sm text-amber-200/90">
        Vault 未启用。在 agent/.env 设置 QQ_VAULT_PATH 后重启。
      </div>
      <template v-else>
        <div class="flex flex-col sm:flex-row gap-2">
          <input v-model="vaultQ" @keyup.enter="loadVault" placeholder="搜笔记…"
                 class="flex-1 bg-black/30 border border-slate-600 rounded-xl px-3 py-2" />
          <button @click="loadVault" class="tap px-4 py-2 rounded-xl bg-slate-700 text-sm">搜</button>
          <button @click="openCreate('vault')" class="tap px-4 py-2 rounded-xl bg-teal-700/80 text-sm">＋ 新建笔记</button>
        </div>
        <div class="card p-3">
          <div ref="graphEl" class="graph-box w-full rounded-xl bg-black/20"></div>
        </div>
        <div class="space-y-2">
          <div v-for="f in vault.files" :key="f.path" class="card p-3">
            <p class="text-sm break-all">{{ f.title || f.path }}</p>
            <p class="text-[11px] text-slate-500 mt-1 break-all">{{ f.path }}</p>
            <div class="flex flex-wrap gap-1.5 mt-2">
              <button @click="previewVault(f)" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700">预览</button>
              <button @click="editVault(f)" class="tap text-xs px-2 py-1 rounded-lg bg-slate-700">编辑</button>
              <a :href="'/api/vault/file/download?path='+encodeURIComponent(f.path)"
                 class="tap text-xs px-2 py-1 rounded-lg bg-slate-700 inline-flex items-center">下载</a>
              <button @click="delVault(f)" class="tap text-xs px-2 py-1 rounded-lg bg-rose-800/80">删除</button>
            </div>
          </div>
        </div>
      </template>
    </section>
  </template>

  <!-- Modal -->
  <div v-if="modal.open" class="fixed inset-0 z-50 modal-bg flex items-end sm:items-center justify-center p-0 sm:p-4"
       @click.self="closeModal">
    <div class="card w-full sm:max-w-lg max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between gap-2">
        <h3 class="font-medium">{{ modal.title }}</h3>
        <button @click="closeModal" class="tap px-3 py-1 rounded-lg bg-slate-700 text-sm">关闭</button>
      </div>

      <template v-if="modal.mode==='preview'">
        <pre class="preview">{{ modal.content }}</pre>
        <a v-if="modal.download" :href="modal.download"
           class="tap inline-flex px-4 py-2 rounded-xl bg-teal-700/80 text-sm">下载文件</a>
      </template>

      <template v-else>
        <label v-if="modal.fields.includes('title')" class="block text-xs text-slate-400">标题
          <input v-model="form.title" class="mt-1 w-full bg-black/30 border border-slate-600 rounded-xl px-3 py-2" />
        </label>
        <label v-if="modal.fields.includes('due_at')" class="block text-xs text-slate-400">截止 due_at（ISO）
          <input v-model="form.due_at" placeholder="2026-10-16T18:00:00+08:00"
                 class="mt-1 w-full bg-black/30 border border-slate-600 rounded-xl px-3 py-2" />
        </label>
        <label v-if="modal.fields.includes('category')" class="block text-xs text-slate-400">分类
          <select v-model="form.category" class="mt-1 w-full bg-black/30 border border-slate-600 rounded-xl px-3 py-2">
            <option value="todo">todo</option>
            <option value="exam">exam</option>
            <option value="meeting">meeting</option>
            <option value="activity">activity</option>
          </select>
        </label>
        <label v-if="modal.fields.includes('kind')" class="block text-xs text-slate-400">类型 kind
          <input v-model="form.kind" class="mt-1 w-full bg-black/30 border border-slate-600 rounded-xl px-3 py-2" />
        </label>
        <label v-if="modal.fields.includes('path')" class="block text-xs text-slate-400">路径（可空=自动）
          <input v-model="form.path" class="mt-1 w-full bg-black/30 border border-slate-600 rounded-xl px-3 py-2" />
        </label>
        <label v-if="modal.fields.includes('text')" class="block text-xs text-slate-400">内容
          <textarea v-model="form.text" rows="10"
                    class="mt-1 w-full bg-black/30 border border-slate-600 rounded-xl px-3 py-2"></textarea>
        </label>
        <p v-if="modal.error" class="text-rose-300 text-xs">{{ modal.error }}</p>
        <button @click="saveModal" class="tap w-full py-3 rounded-xl bg-teal-600 text-sm font-medium" :disabled="modal.saving">
          {{ modal.saving ? '保存中…' : '保存到数据库' }}
        </button>
      </template>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted, nextTick } = Vue;
createApp({
  setup() {
    const me = ref(null), err = ref(''), metrics = ref(null);
    const schedules = ref([]), knowledge = ref([]);
    const vault = ref({ enabled: false, files: [], graph: { nodes: [], edges: [] } });
    const memQ = ref(''), vaultQ = ref(''), tab = ref('sched');
    const graphEl = ref(null);
    let chart = null;
    const tabs = [
      { id: 'sched', label: '待办' },
      { id: 'mem', label: '记忆' },
      { id: 'vault', label: 'Vault' },
    ];
    const boardCols = [
      { key: 'pending', label: '进行中' },
      { key: 'done', label: '已完成' },
      { key: 'cancelled', label: '已取消' },
    ];
    const modal = reactive({
      open: false, mode: 'edit', title: '', content: '', download: '',
      kind: '', fields: [], error: '', saving: false, id: null,
    });
    const form = reactive({ title: '', text: '', due_at: '', category: 'todo', kind: 'note', path: '' });

    async function api(path, opts) {
      const r = await fetch(path, { credentials: 'same-origin', ...opts });
      if (!r.ok) throw new Error((await r.text()) || r.statusText);
      const ct = r.headers.get('content-type') || '';
      if (ct.includes('application/json')) return r.json();
      return r.text();
    }
    function byStatus(st) {
      return schedules.value.filter(s => {
        const x = s.status || 'pending';
        if (st === 'pending') return x === 'pending' || x === 'reminded';
        return x === st;
      });
    }
    function closeModal() { modal.open = false; modal.error = ''; }

    async function loadMe() { me.value = await api('/api/me'); }
    async function loadMetrics() { metrics.value = await api('/metrics'); }
    async function loadSchedules() {
      const d = await api('/api/schedules');
      schedules.value = d.items || [];
    }
    async function loadKnowledge() {
      const d = await api('/api/knowledge?q=' + encodeURIComponent(memQ.value || '') + '&limit=50');
      knowledge.value = d.items || [];
    }
    async function loadVault() {
      const d = await api('/api/vault?q=' + encodeURIComponent(vaultQ.value || ''));
      vault.value = d;
      await nextTick();
      if (!graphEl.value || !window.echarts || !d.enabled) return;
      if (!chart) chart = echarts.init(graphEl.value);
      const g = d.graph || { nodes: [], edges: [] };
      chart.setOption({
        backgroundColor: 'transparent',
        series: [{
          type: 'graph', layout: 'force', roam: true,
          data: (g.nodes || []).map(n => ({ ...n, label: { show: true, color: '#c9d4e0', fontSize: 9 } })),
          links: g.edges || [],
          force: { repulsion: 140, edgeLength: 70 },
          lineStyle: { color: '#3d5468' }, itemStyle: { color: '#14b8a6' },
        }],
      });
      chart.resize();
    }

    async function setStatus(s, status) {
      await api('/api/schedules/' + s.id + '/status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      await loadSchedules();
    }
    async function delSched(s) {
      if (!confirm('删除待办「' + s.title + '」？')) return;
      await api('/api/schedules/' + s.id, { method: 'DELETE' });
      await loadSchedules();
    }
    async function delMem(k) {
      if (!confirm('删除记忆？')) return;
      await api('/api/knowledge/' + k.id, { method: 'DELETE' });
      await loadKnowledge(); loadMetrics();
    }
    async function delVault(f) {
      if (!confirm('删除笔记 ' + f.path + '？')) return;
      await api('/api/vault/file?path=' + encodeURIComponent(f.path), { method: 'DELETE' });
      await loadVault(); loadMe();
    }

    async function previewMem(k) {
      const d = await api('/api/knowledge/' + k.id);
      modal.open = true; modal.mode = 'preview';
      modal.title = d.title || k.id;
      modal.content = d.text_full || d.text || '';
      modal.download = '/api/knowledge/' + k.id + '/download';
    }
    async function previewSched(s) {
      const d = await api('/api/schedules/' + s.id);
      modal.open = true; modal.mode = 'preview';
      modal.title = d.title;
      modal.content = JSON.stringify(d, null, 2);
      modal.download = '/api/schedules/' + s.id + '/download';
    }
    async function previewVault(f) {
      const d = await api('/api/vault/file?path=' + encodeURIComponent(f.path));
      modal.open = true; modal.mode = 'preview';
      modal.title = d.title || f.path;
      modal.content = d.content || '';
      modal.download = '/api/vault/file/download?path=' + encodeURIComponent(f.path);
    }

    function openCreate(kind) {
      modal.open = true; modal.mode = 'create'; modal.kind = kind; modal.id = null; modal.error = '';
      form.title = ''; form.text = ''; form.due_at = ''; form.category = 'todo'; form.kind = 'note'; form.path = '';
      if (kind === 'sched') {
        modal.title = '新建待办'; modal.fields = ['title', 'due_at', 'category'];
        const d = new Date(Date.now() + 86400000);
        form.due_at = d.toISOString().slice(0, 19) + '+08:00';
      } else if (kind === 'mem') {
        modal.title = '新建记忆'; modal.fields = ['title', 'kind', 'text'];
      } else {
        modal.title = '新建 Vault 笔记'; modal.fields = ['title', 'path', 'text'];
        form.text = '---\ntitle: \ntags: [qq-agent]\n---\n\n';
      }
    }
    async function editMem(k) {
      const d = await api('/api/knowledge/' + k.id);
      modal.open = true; modal.mode = 'edit'; modal.kind = 'mem'; modal.id = k.id;
      modal.title = '编辑记忆'; modal.fields = ['title', 'kind', 'text']; modal.error = '';
      form.title = d.title || ''; form.kind = d.kind || 'note'; form.text = d.text_full || d.text || '';
    }
    function editSched(s) {
      modal.open = true; modal.mode = 'edit'; modal.kind = 'sched'; modal.id = s.id;
      modal.title = '编辑待办'; modal.fields = ['title', 'due_at', 'category']; modal.error = '';
      form.title = s.title; form.due_at = s.due_at || ''; form.category = s.category || 'todo';
    }
    async function editVault(f) {
      const d = await api('/api/vault/file?path=' + encodeURIComponent(f.path));
      modal.open = true; modal.mode = 'edit'; modal.kind = 'vault'; modal.id = f.path;
      modal.title = '编辑笔记'; modal.fields = ['path', 'text']; modal.error = '';
      form.path = f.path; form.text = d.content || '';
    }

    async function saveModal() {
      modal.saving = true; modal.error = '';
      try {
        if (modal.kind === 'sched') {
          const body = { title: form.title, due_at: form.due_at, category: form.category };
          if (modal.mode === 'create') await api('/api/schedules', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          else await api('/api/schedules/' + modal.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          await loadSchedules();
        } else if (modal.kind === 'mem') {
          const body = { title: form.title, kind: form.kind, text: form.text };
          if (modal.mode === 'create') await api('/api/knowledge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          else await api('/api/knowledge/' + modal.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          await loadKnowledge(); await loadMetrics();
        } else {
          if (modal.mode === 'create') {
            await api('/api/vault/file', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: form.title, path: form.path, content: form.text }),
            });
          } else {
            await api('/api/vault/file', {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: form.path || modal.id, content: form.text }),
            });
          }
          await loadVault(); await loadMe();
        }
        closeModal();
      } catch (e) {
        modal.error = String(e.message || e);
      } finally {
        modal.saving = false;
      }
    }

    async function reloadAll() {
      err.value = '';
      try {
        await loadMe();
        await Promise.all([loadMetrics(), loadSchedules(), loadKnowledge(), loadVault()]);
      } catch (e) {
        err.value = String(e.message || e); me.value = null;
      }
    }
    onMounted(reloadAll);
    return {
      me, err, metrics, schedules, knowledge, vault, memQ, vaultQ, tab, tabs, boardCols,
      graphEl, modal, form, byStatus, reloadAll, loadKnowledge, loadVault,
      setStatus, delSched, delMem, delVault, previewMem, previewSched, previewVault,
      openCreate, editMem, editSched, editVault, saveModal, closeModal,
    };
  },
}).mount('#app');
</script>
</body>
</html>
